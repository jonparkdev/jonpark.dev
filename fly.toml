# Fly.io deployment config. Lives outside the image (ADR 0001): the image is a
# plain static server; everything Fly-specific is here.
app = "jonpark-dev"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  # One always-on machine: never stop to zero, so there are no cold starts.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "5s"
    interval = "30s"
    method = "GET"
    path = "/"
    timeout = "5s"

# Smallest shared-CPU size.
[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
